<!DOCTYPE html>
<html lang="hu">

<head>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v=20261107">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon.png') }}?v=20261107">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DINEXA Factory – Belépés</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="app">

    <header>
        <div>
            <div class="dinexa-brand"><img src="{{ url_for('static', filename='images/dinexa-logo.png') }}" alt="DINEXA – Digital Product Intelligence"><span class="dinexa-product-name">Factory</span></div>
            <p>Gyártói munkaállomás</p>
        </div>
    </header>


    <section class="print-card">

        <p class="section-label">
            DINEXA CENTRAL FELHASZNÁLÓI BELÉPÉS
        </p>

        <h2>Bejelentkezés</h2>


        <form method="POST">

            <div class="form-group">

                <label for="employee_id">
                    Felhasználónév
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="pl. Kiss Ernő"
                    autocomplete="username"
                    autofocus
                    required
                >

            </div>


            <div class="form-group">

                <label for="pin">
                    Jelszó
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••"
                    
                    autocomplete="current-password"
                    required
                >

            </div>


            {% if error %}

                <div class="search-not-found">
                    {{ error }}
                </div>

            {% endif %}


            <button
                type="submit"
                class="dpp-button"
            >
                BEJELENTKEZÉS
            </button>

        </form>

        {% if sync_message %}<div class="search-not-found">{{ sync_message }}</div>{% endif %}

        <form method="POST" action="{{ url_for('switch_workstation') }}"
              onsubmit="return confirm('Biztosan új gyártóhoz szeretnéd aktiválni ezt a munkaállomást?');"
              style="margin-top: 18px;">
            <button type="submit" class="dpp-button"
                    style="background:#fff; color:#b42318; border:1px solid #d0d5dd;">
                Gyártó kijelentkeztetése (ideiglenes)
            </button>
        </form>


    </section>

</div>

<script>
// A Factory háttérszinkronja ellenőrzi a Centralt. A megnyitott oldal
// automatikusan az aktiválásra vált, ha a Central visszavonta a hozzáférést.
(function () {
    async function checkActivation() {
        if (document.hidden) return;
        try {
            const response = await fetch({{ url_for('factory_activation_status') | tojson }}, {
                cache: 'no-store', credentials: 'same-origin'
            });
            if (!response.ok) return;
            const status = await response.json();
            if (status.reactivation_required) {
                window.location.replace({{ url_for('activate_workstation') | tojson }});
            }
        } catch (error) {
            // Offline állapotban a helyi alkalmazás tovább használható.
        }
    }
    checkActivation();
    window.setInterval(checkActivation, 5000);
    document.addEventListener('visibilitychange', checkActivation);
})();
</script>
</body>

</html>
