<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DINEXA Factory – Címke előnézet</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="app">

    <header>
        <div>
            <div class="dinexa-brand">
                <img src="{{ url_for('static', filename='images/dinexa-logo.png') }}" alt="DINEXA – Digital Product Intelligence">
                <span class="dinexa-product-name">Factory</span>
            </div>
            <p>Címke előnézet</p>
        </div>

        <div class="online">
            <span></span>
            ONLINE
        </div>
    </header>


    <section class="print-card">

        <p class="section-label">
            CÍMKE ELŐNÉZET
        </p>

        <h2>{{ quantity }} db címke</h2>


        {% if serials %}
            {% for serial in serials %}
            <div class="label-preview" style="margin-bottom: 16px;">
                <img src="{{ url_for('factory_qr', filename=qr_filename) }}" alt="DPP QR-kód">
                <div class="label-prn">{{ serial }}</div>
            </div>
            {% endfor %}

        {% else %}
            <div class="label-preview">
                <img src="{{ url_for('factory_qr', filename=qr_filename) }}" alt="DPP QR-kód">
                <div class="label-prn">{{ print_id }}</div>
            </div>
        {% endif %}

        <a href="/" class="new-print-button">
            Új nyomtatás
        </a>

    </section>

</div>

</body>

</html>
