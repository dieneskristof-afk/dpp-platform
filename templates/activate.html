<!DOCTYPE html>
<html lang="hu"><head>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v=20261107">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon.png') }}?v=20261107"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DINEXA Factory – Aktiválás</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="app"><header><div><div class="dinexa-brand"><img src="{{ url_for('static', filename='images/dinexa-logo.png') }}" alt="DINEXA"><span class="dinexa-product-name">Factory</span></div><p>Munkaállomás aktiválása</p></div></header>
<section class="print-card"><p class="section-label">ELSŐ INDÍTÁS</p><h2>Munkaállomás aktiválása</h2>
<p>Az azonosítókat és az aktiváló kódot a DINEXA Central gyártói munkaállomások oldalán találod.</p>
<form method="POST">

<div class="form-group"><label for="manufacturer_code">Gyártóazonosító</label><input id="manufacturer_code" name="manufacturer_code" placeholder="DNX-M-..." required></div>
<div class="form-group"><label for="workstation_code">Munkaállomás-azonosító</label><input id="workstation_code" name="workstation_code" placeholder="DNX-W-..." required></div>
<div class="form-group"><label for="activation_code">Aktiváló kód</label><input id="activation_code" name="activation_code" autocomplete="off" required></div>
{% if error %}<div class="search-not-found">{{ error }}</div>{% endif %}
<button type="submit" class="dpp-button">MUNKAÁLLOMÁS AKTIVÁLÁSA</button></form></section></div></body></html>
